      campaign state are exactly as ANN-66 left them.
      WHAT THE DOCUMENT IS FOR. It is not a second copy of the
      extraction result. Its load-bearing content is six errata against
      a steering draft of 2026-07-24 that circulated but never entered
      the tree, plus a re-ranking of the three named hypotheses and one
      observation the extraction report does not carry. Three of the six
      errata (E1 axis definition, E3 Pintz rank pricing, E4 Kuperberg
      constant) are already booked in ANN-66; landing the document puts
      the remaining three in the tree where they can be found.
      E2, THE ERRATUM BOOKED NOWHERE ELSE, stated here so it is
      searchable from the ledger alone. The draft argued that the target
      window (ln x)(lnln x) "lies strictly inside (log x)^2.1" and
      counted Matomaki-Teravainen 2207.05038 as the strongest window
      hit. That is backwards: an almost-all-intervals statement at a
      LONGER window is the WEAKER statement and implies nothing at a
      shorter one. The extraction verdict for 2207.05038 is A2 FAILS.
      The genuine unconditional window hits are Teravainen 1510.06005
      and Matomaki 2012.11565, whose windows approach log x from above
      -- the opposite end of the same family from where the draft
      pointed. Support: PROVED (the implication direction is
      elementary); the per-anchor verdicts are RECORDED from
      dossier/item-0026-workpapers/extraction-report.md section 5.
      E5 AND E6, also landed by this entry. E5: the draft presented
      Kuperberg Theorem 1.2 and Pintz Theorem 1' as material both review
      runs had missed; both were already extracted at
      dossier/item-0017-workpapers/extract/, Theorem 1.2 with its own
      focus section. The real finding is narrower and more useful --
      extracted material never reached the S1 axis pricing, which is a
      routing defect in this project, not a gap in the shelf. E6: the
      draft's argument for hypothesis H1 is withdrawn (booked in
      ANN-66); the document additionally downgrades H1 itself and
      re-ranks H2 first, on the ground that H2 is the only registered
      hypothesis aimed at A3 and A3 is the named absence. NO ROADMAP
      ITEM IS CREATED, RE-SCOPED, OR RE-ORDERED by this entry; the
      re-ranking is a recommendation and nothing more.
      EDITORIAL CHANGES AGAINST THE APPROVED DRAFT, all agreed with the
      operator before authoring and none touching substance: the
      HANDOVER.md delta section is dropped because ANN-67 executed it
      and it would otherwise read as an open task list; the per-axis
