      dossier/item-0026-workpapers/extraction-report.md section 5.
      THE INTERPRETIVE QUESTION, recorded rather than passed over. The
      claim's parenthesis enumerates regime, rank, strength and scale
      density; it does not enumerate grain, which is the axis item-0026
      named as the located absence, because the A1-A6 decomposition did
