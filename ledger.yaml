  - id: BET-20260711-06
    registered: 2026-07-11
    claim: the implication already exists in prior literature or preprints
    p: 0.10
    resolution: item A1 literature verification
    resolve_by: before any public claim
    outcome: false  # prior-art sweep NOT-FOUND (dossier/literature.md, item 9)
    brier: 0.01
    note: >-
      Resolved by the item-0004 research-mode sweep (2026-07-16): no
      journal paper, preprint, blog, forum post or slides state the
      target implication (uniform HL tuples + Cramer-type gaps ==>
      irrationality of sum p_n/2^n) or anything materially equivalent,
      and no stronger unconditional result exists; #251 is open on its
      problem page with no post-2026-04-15 activity; the only near
      neighbors (Pratt 2024/2025, Tao-Teravainen 2025) treat bounded
      omega(n) and explicitly place growing numerators outside current
      technique. Nine months after Tao's forum sketch the niche is
      unoccupied. Reversal threshold (booked): an arXiv preprint or
      forum/blog post stating the implication, or an unconditional
      #251 proof. Scoring booked ANN-28; binary mean brier moves
      0.183 -> 0.149 over five scored.

  - id: BET-20260724-10
    registered: 2026-07-24
    claim: >-
      the same search locates at least one unconditional near-miss of
      the right family whose gap to the named shape is stated,
      bounded, and named by axis (regime, rank, strength, or scale
      density) rather than open-ended -- scored independently of
      BET-20260724-09 and in particular still live if that bet
      resolves NO
    p: 0.20
    resolve_by: 2026-08-31
    outcome: true   # four unconditional near-misses, each primary-anchored with a named gap axis
    brier: 0.64
    note: >-
      Resolved by operator judgment on the item-0026 per-candidate
      checklist (extraction-report.md section 5), 2026-07-25, five
      weeks before resolve_by. FOUR qualifying candidates, each
      unconditional, each with a primary anchor booked in
      payloads/HASHES.txt and an explicitly named gap axis: de la
      Breteche-Fiorilli 2009.05760 (clears scale density and
      direction; gap = rank, window, grain), Teravainen 1510.06005
      (clears window; gap = rank, grain), Matomaki 2012.11565 (clears
      window; gap = rank, grain, direction), Matomaki-Teravainen
      2207.05038 (gap = window, grain). One counted would suffice.
      The one interpretive question, recorded rather than passed over:
      the claim's parenthesis lists regime, rank, strength and scale
      density, and does NOT list grain, which is the axis item-0026
      actually named as the located absence -- the axis decomposition
      A1-A6 did not exist when the bet was registered. The resolution
      does not turn on how that parenthesis is read. Under the loose
      reading (the list illustrates what "named by axis" means, as
      against "open-ended") all four qualify. Under the strict reading
      (the list is exhaustive) at least dlB-F and Teravainen still
      qualify, since rank is among their named gaps and rank is on the
      list. YES under both readings.
      CALIBRATION. Worst binary brier in the ledger; the prior was far
      too low. The diagnosis is not that steering was pessimistic about
      the literature -- that pessimism was right, and BET-20260724-09
      still stands unmet -- but that the bet was BADLY CONSTRUCTED: its
      resolution condition depends on an instrument, the axis
      decomposition, which the project itself created between
      registration and resolution. Once axes are defined, every gap is
      named by axis nearly by construction, so the bet partly measured
      its own resolution machinery rather than a fact about the
      literature. Lesson booked for future registrations: a bet whose
      condition can be satisfied by a change in the project's own
      description language is not a forecast. Binary mean brier moves
      0.149 -> 0.231 over six scored.

  - id: BET-20260724-09
    registered: 2026-07-24
    claim: >-
      the item-0026 search locates and primary-anchors an
      unconditional statement of the named S1 carrier shape --
      averaged middle-slot non-concentration or upper-uniformity at
      rank k = (2/ln 2 + o(1)) lnln x, window A' L ln x, of strength
      enough to keep a fixed proportion of D0-depth site mass off its
      modal middle on some unbounded scale sequence per s, and failing
      in the even-Cramer-smooth model -- usable for (CG) without
      further conjectural input
    p: 0.05
    resolve_by: 2026-08-31
    outcome: false  # no candidate carries the shape; failure is overdetermined
    brier: 0.0025
    note: >-
      Resolved by operator judgment on the item-0026 per-candidate
      checklist (extraction-report.md section 5), 2026-07-25. NOT MET,
      and overdetermined: the one candidate reaching both rank and
      window (Jha 2605.23014) is conditional on a strong
      Hardy-Littlewood variant, which fails "unconditional" and "without
      further conjectural input" twice over; every unconditional
      candidate misses rank; ALL SEVEN miss the word grain, so none is
      usable for (CG) whatever else it clears; and the
      even-Cramer-smooth clause is untested for all seven, since no
      anchor speaks to this project's deterministic gap system. Any one
      of these four independently decides the bet NO.
      CALIBRATION, and the reason this good score should not be read as
      a good forecast. The bet was close to undecidable in the YES
      direction from the start. Its claim conjoins seven conditions,
      one of which -- failure in the even-Cramer-smooth model -- is a
      property no number theorist has reason to check, because the
      model is this project's own construction and appears nowhere in
      the literature. A published statement satisfying that clause by
      accident is close to a null event, so the bet was nearly
      unloseable and the 0.0025 measures the claim's construction more
      than steering's judgment. This is the same defect ANN-70 booked
      for BET-20260724-10, with the sign reversed: there a condition
      the project could satisfy by redescription, here a condition the
      literature could not satisfy at all. Both are bets on the
      project's own vocabulary rather than on the world.
      Binary mean brier moves 0.231 -> 0.198 over seven scored. That
      improvement is an artifact of this bet's construction and should
      not be read as recalibration; the five bets scored before
      2026-07-24 average 0.149, and that figure remains the more honest
      picture of forecasting performance on externally-decidable
      claims.

