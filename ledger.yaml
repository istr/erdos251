      cites 1004.1072 correctly for the claim it supports: that paper's
      Lemma 1 and Lemma 2 bound fixed-rank power sums of the singular
      series, and its proof of Lemma 2 runs through a per-position ratio
      sum over one added element h, with the paper stating in the same
      breath that the dependence of the implied constants on the rank and
      on the exponent is not marked. In project vocabulary that is an
      AVERAGED RELATIVE ONE-POSITION EXTENSION BOUND on the same rho
      object item-0019 m3 censused, with exactly the rank-uniformity the
