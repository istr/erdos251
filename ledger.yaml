# POINTER, NOT THE LEDGER (item-0032).
#
# This path held the whole ledger -- version, convention, bets and the entire
# annotation history -- as one file until the item-0032 split. It is kept as a
# pointer, and not deleted, because several references to it sit in historical
# and evidentiary material under dossier/ that is not editable. A reference to
# this path lands here rather than on nothing.
#
# The ledger is now stored as:
#
#   ledger/bets.yaml       version, convention, scored, open. MUTABLE: scoring
#                          a bet legitimately moves it between blocks.
#
#   ledger/annotations/    one file per annotation entry, named <id>.yaml.
#                          STRICTLY APPEND-ONLY: a landed entry is never
#                          modified, deleted or renamed. An amendment is a
#                          successor entry, never an edit.
#
# Why one file per entry: append-only stops being a discipline a human checks
# by reading a diff and becomes a property a check enforces. That rule had
# already been broken once (ANN-20260724-63) and was caught by eye.
#
# The split is a pure relocation. The entry files, concatenated in ascending
# sequence order, reproduce this file's annotations body at the pre-split pin
# 733f989b5487b3ce39a5d53137bd6f3b6aaf4e92 byte for byte -- 5298 lines,
# sha256 24f7e372cdee3cf708d4d6ebf2f59b0f719c8328d1eb0cd8328bd81785dae7aa.
# That is re-proved on every CI run, so it does not expire at the split
# commit; it keeps proving that no pre-split entry has been edited since.
#
# Check it any time, from the repo root:
#
#   python3 scripts/ledger_check.py relocation-check
#   python3 scripts/ledger_check.py validate
#   python3 scripts/ledger_check.py append-only --base <rev>
#
# The pre-split content of this path is in git history at the pin above.

moved_to:
  bets: ledger/bets.yaml
  annotations: ledger/annotations/
  checks: scripts/ledger_check.py
  booked_by: ANN-20260731-87
