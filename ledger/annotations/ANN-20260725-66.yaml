      THE FINDING (STOP condition 6, reported not fabricated). The
      dispatched question was the absolute constant c_2 in Pintz (1.8).
      The answer is that it is not recoverable from the printed proof
      in the regime the theorem itself operates in. The governing
      display, quoted per rule 19 from dossier/1004.1084v1.pdf via the
      transcription in dossier/item-0017-workpapers/extract/
      pintz10-singser.md: "(2.3)  \Pi_3 = \prod_{p>y} ( 1 + O(k/p^2) )
      = 1 + O( k/(y log y) )". With y := 5 log H / 6 from (2.1), the
      exact per-factor value is nu_p / ((p - nu_p)(p - 1)), which is
      O(k/p^2) only where nu_p/p is bounded away from 1, i.e. p >> k.
      Theorem 1 lives there (H >= exp(k^{1/eps}) forces k << y).
      Theorem 1' does not: at its own threshold H = exp(c_2 k/log k)
      one gets k/y = 6 log k / (5 c_2) -> infinity for every fixed
      absolute c_2, so the band y < p <= k is non-empty and carries
      per-factor deviations of order 1. Support: PROVED (finite
      algebra, re-derived independently by steering before reading the
      workpaper; the identity and the k/y computation both check).
      WHAT THE FINDING IS NOT. It is not a refutation of Theorem 1'.
      The pointwise failure sits on a set of extension positions h of
      density o(1), and an averaging argument over good h together with
      CRT independence of the small-prime factor plausibly rescues the
      statement as printed. What is absent from the four-page note is
      that argument: the text multiplies the pointwise floor (2.8) by
      the exact average (2.7), and the pointwise floor is what fails.
      So the entry books a GAP IN THE PRINTED BOOKKEEPING, named at its
      exact step, and explicitly declines to book either a corrected
      constant or a defect in the theorem. The weakest link in the
      finding is the CRT construction exhibiting a tuple that realises
      the failure: it is sketched, not carried out. The gap itself does
      not depend on it; the strengthening from "the proof does not show
      it" to "pointwise it is false" does.
