      NUMERICAL VERIFICATION OF REPORT 1's k=2 CORE, measured in the
      steering sandbox. Kowalski's Example 3.5 Euler product was
      evaluated independently over primes below 2e6 in 30-digit
      arithmetic; the local factor is 1 + p^-3 + O(p^-4), so the
      truncation is far below the digits reported. The implementation
      first reproduces Kowalski's own printed values mu_k(2) for k = 2
      through 6 (2.300..., 6.03294..., 17.562..., 55.255..., 184.18...),
      and then reproduces all three of report 1's derived figures to
      every printed digit: mu_2(2) = 2.3009615447..., E_even[S^2] =
      4.6019230894..., and E_even[S^2]/E_even[S]^2 = 1.1504807723... .
      Also confirmed against the note: mu_k(1) = 1, the symmetry
      mu_k(m) = mu_m(k), log mu_k(m) = km loglog(3m) + O(m), the k=2
      specialisation log mu_k(2) = 2k loglog(3k) + O(k), and the parity
      cause, the 2-factor vanishing unless all entries share a parity,
      which has probability 2^(1-k) and hence 1/2 at k=2. Report 1's k=2
      obstruction is therefore CONFIRMED on its numbers. The verdict
      classes still have to be assigned claim by claim inside item-0022;
      this entry pre-empts none of them except by recording what was
      measured.
