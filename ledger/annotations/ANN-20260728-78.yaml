      evidence the display was not proofread. THE COHERENT READING IS A
      GENERAL-r BOUND under the cardinality restriction, and the printed
      exponent 2 together with the missing size restriction is a v1
      TYPESETTING DEFECT. THIS IS RECORDED AS A FIDELITY FINDING ABOUT
