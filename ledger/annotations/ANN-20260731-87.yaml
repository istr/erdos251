      THE FOUR RATIFIED DECISIONS, all at the dispatch's recommended
      defaults. D-A layout: the old path becomes a pointer stub, a new
      ledger/bets.yaml holds the mutable head, a new
      ledger/annotations/ holds one file per entry -- the item names
