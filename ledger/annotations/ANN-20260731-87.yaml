      THE THREE CHECKS, one script, scripts/ledger_check.py, pure
      stdlib, sibling to mathjax_lint.py, all three wired into CI as a
      new `ledger` job in .github/workflows/lint.yml. (1)
      relocation-check bakes the pre-split pin as its default rev and
      compares the concatenation to `git show <pin>:ledger.yaml`, so it
      DOES NOT EXPIRE AT THE SPLIT COMMIT: it re-proves on every run
      that no pre-split entry has been edited since, which is the same
      invariant append-only enforces for everything added later, stated
      absolutely rather than incrementally. The instrument is the one
      the project already owns from the item-0016 Lean split
      (lean/scripts/blocks.py). (2) validate checks filename equals the
      id the file carries, ids unique, sequence numbers contiguous
      1..N, every entry parsing to id / refs / date, no stray file
      under annotations/, and ref integrity BY NAMESPACE: an internal
      ref (ANN- or BET-) must name a live id or sit on the allowlist,
      ERRATUM- is a legal external namespace and is not resolved, and
      any other token fails. (3) append-only requires that
      `git diff <base>..HEAD` show additions only under
      ledger/annotations/; any M, D or R fails. The CI job checks out
      at fetch-depth 0, which is load-bearing and not hygiene, since
      the relocation check reads the pin.
      ONE DEVIATION FROM THE DISPATCH'S REFERENCE IMPLEMENTATION,
      FLAGGED RATHER THAN ABSORBED. Its Appendix B concatenates EVERY
      file under annotations/ and compares that to the pinned body.
      That is green only while the store still holds exactly the pinned
      entries, so it fails on the FIRST legitimate append -- including
      this apply's own booking entry, which the same dispatch's Section
      8 requires in the same commit. The two sections are inconsistent
      as literally implemented, and the reference ran green in
      authoring only because ANN-87 did not exist yet. Resolved in
      favour of the ratified item's own words, which are unambiguous:
      the check "keeps proving, on every run, that no historical entry
      has been edited since, which is the same invariant the
      append-only check enforces for everything added later". THE
      LANDED CHECK THEREFORE READS ITS SCOPE OFF THE PIN: it
      concatenates exactly the entries the pinned body names, in the
      order the pinned body carries them, having first asserted that
      that order IS ascending sequence order, and it reports post-pin
      entries as out of scope and append-only's business. This is
      strictly stronger than the reference on the historical set, since
      a pinned entry that is deleted or renamed now fails BY NAME
      instead of silently shifting the concatenation, and it is the
      only reading under which the item's acceptance and its own
      reflexive booking can both hold.
      THE APPEND-ONLY GUARANTEE IS INCREMENTAL, AND THE CAVEAT IS
      RECORDED RATHER THAN SOLVED HERE. It composes into a
      whole-history guarantee only under branch protection that forbids
      force-push to main and preserves linear history; correct base
      resolution in CI is the fragile part, so the workflow resolves
      the pull_request base sha or the push before-sha and SKIPS
      LOUDLY, rather than passing silently, when neither is present (a
      branch's first push carries the all-zero sha). Every PRE-split
      entry is covered absolutely by the relocation check regardless. A
      single per-file sha manifest was considered and REJECTED: an
      in-place edit of a manifest line is indistinguishable from an
      append, which is exactly the discipline-vs-mechanism failure this
      item removes, so it would reintroduce the problem one level up.
