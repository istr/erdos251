      THE CHECK, AS ORDERED. The operator asked, against the
      steering claim that the 82ee6c7d landing-vs-booking split
      deviates from rule 25: by what procedure CAN landing and
      booking share one apply, given that a bet close must not share
      an apply with the implementation it judges -- and whether the
      operative rules contradict each other. Rules read in full at
      the pin: runs/README.md 1-27, AGENTS.md, the bets.yaml
      convention header, the item-0032 final summary and ANN-87
      tension paragraph, and the item-0029 precedent commits 8fb23b5
      (landing) and 51afdd0 (scoring).
      FINDING 1, NO TEXTUAL CONTRADICTION. Rule 25 binds "the ledger
      entry that BOOKS IT", it = the artifact drop. A bet score does
      not book the drop; it books a separate operator act -- the
      judgment against the landed artifact -- which structurally
      postdates the landing (the resolution clauses read "operator
      judgment against the <artifact>", and the standing practice,
      BET-09/10/11/12, is that scoring is never in-run). Two booking
      units, two self-booking applies: the item-0029 close ran
      exactly so (8fb23b5 lands artifacts WITH their booking, bet
      explicitly left open; 51afdd0 scores it with ANN-99). Read at
      the unit level, rule 25 and the scoring separation govern
      different objects and compose without conflict.
      FINDING 2, ONE REAL GAP, WITH THIS CLOSE AS ITS DEMONSTRATED
      CASE. Rule 25 is silent on WHO authors the landing booking and
      on WHEN the ratifier may apply, for the case where the
      execution contract fences the bookkeeping paths off the run --
      which the item-0035 dispatch did (booking routed to steering,
      "riding the operator's single ratifying apply"). Under that
      split, no written rule told the ratifier to hold the artifact
      commit until the booking mbox arrived and apply both in one
      invocation; the operator applied the workpapers on their own
      -- legitimately, under the rules as written -- and 82ee6c7d
      became the D1 void's third occurrence (item-0022 D1; ANN-77),
      the first produced by the rule set itself rather than by any
      session's breach. A rule whose conforming path is not
      constructible from its own text has a gap even when no two
      sentences collide.
      THE RULE, three clauses, appended as rule 28. (i) UNITS: an
      apply is one operator git-am invocation and may carry several
      commits; rule 25's unit is the commit -- every commit carries
      the booking of its own edits, and an artifact commit applied
      without its booking is the void, whoever was supposed to write
      the booking. (ii) TWO CONFORMING LANDING FORMS: in-run booking
      (contract grants the run the bookkeeping paths; artifacts and
      booking are one commit; the item-0029 form) or bundled apply
      (contract fences the paths; steering authors the booking
      commit against exactly the artifact commit; the operator
      applies both in one invocation, and the landing time is that
      apply). Applying the artifact commit early creates the void;
      if the operator chooses it anyway, nothing else is applied
      before the booking mbox and the booking names the split. (iii)
      BET SCORES ARE THEIR OWN UNIT: never in the landing commit,
      never in-run; in the conforming forms the landing booking
      states the bet stays open and the score lands as its own later
      self-booking apply; when the (ii) split has already occurred
      and the judgment is already rendered, score and late landing
      booking may travel as one self-booking bookkeeping commit --
      the invariant is the sequence, judgment strictly after the
      artifact commit is applied and readable, not the commit count.
      EXPLICITLY UNTOUCHED: the
      item-0032 registration-versus-scoring tension
      (append-never-rewrite vs the block move) stays exactly as
      ANN-87 left it -- this rule cuts apply units, not the bets
      file's internal convention.
      PRACTICAL ANSWER TO THE OPERATOR QUESTION, one line: landing
      and its LANDING BOOKING can and must share one apply (form (a)
      or (b)); the BET CLOSE never joins them and never needs to,
      because it books a different act -- the perceived either-or
      dissolved with the unit confusion.
