      entry or hash line is touched by this commit; payloads/
      HASHES.txt is byte-unchanged (runs/README.md is a rules file,
      not a payload). The item-0035 landing stays booked-pending:
      its close-bookkeeping mbox follows as the IMMEDIATELY NEXT
